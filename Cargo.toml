[package]
name = "lenso-support-email-resend"
version = "0.1.0"
edition = "2024"
publish = true
rust-version = "1.94"
license = "MIT"
description = "Verified Resend inbound-email adapter for Lenso Support applications."
repository = "https://github.com/LioRael/lenso-support-email-resend-plugin"

[package.metadata.lenso]
plugin-id = "lenso.support-email.resend"
root-slot = "web"

[dependencies]
base64 = "0.22"
hmac = "0.12"
lenso = "0.5.0"
lenso-capability-customer-directory = "0.1.0"
lenso-capability-http-client = "0.2.3"
lenso-capability-http-endpoint = "0.2.7"
lenso-capability-secrets = "0.1.2"
lenso-capability-support-intake = "0.1.0"
lenso-kernel = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = "0.3"

[dev-dependencies]
futures = "0.3"

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
