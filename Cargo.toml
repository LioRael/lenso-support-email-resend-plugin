[package]
name = "lenso-support-email-resend"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"
license = "MIT"
description = "Verified Resend inbound-email adapter for Lenso Support applications."
repository = "https://github.com/LioRael/lenso-support-email-resend-plugin"

[package.metadata.lenso]
plugin-id = "lenso.support-email.resend"
root-slot = "web"

[dependencies]
base64 = "0.22"
hmac = "0.12"
lenso = { version = "0.5.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "89815107385475c8b5be378bdcf5e21aa74e02f0" }
lenso-capability-customer-directory = { version = "0.1.0", git = "https://github.com/LioRael/lenso-customer-directory-plugin", rev = "4383b3ce85fdbfaf62974ba64beb203ea9ccaf42" }
lenso-capability-http-client = { version = "0.2.3", git = "https://github.com/LioRael/lenso-web", rev = "56acd0d058b9ce29c1551da73c865cb523ad4df9" }
lenso-capability-http-endpoint = { version = "0.2.7", git = "https://github.com/LioRael/lenso-web", rev = "56acd0d058b9ce29c1551da73c865cb523ad4df9" }
lenso-capability-secrets = { version = "0.1.2", git = "https://github.com/LioRael/lenso-secrets-plugin", rev = "967fa0d2908b58c24a4b1ad26103a3d9173bbac0" }
lenso-capability-support-intake = { version = "0.1.0", git = "https://github.com/LioRael/lenso-support-case-plugin", rev = "8d8a173e699ff7cae06fecd719e3f1ee3c1834c0" }
lenso-kernel = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "8599db7e4a214ed92f32089f81d14c833d4becf6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = "0.3"

[dev-dependencies]
futures = "0.3"

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
